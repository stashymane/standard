name: Publish

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Prepare Java & Gradle
        uses: stashymane/actions/prepare-gradle@a4bdc027bd0aa9a31b817f406294bf0070c6ec76
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Resolve version
        id: version
        uses: stashymane/actions/get-version@a4bdc027bd0aa9a31b817f406294bf0070c6ec76
        with:
          snapshot: ${{ github.ref_type == 'tag' && 'false' || 'true' }}
          # GitHub packages doesn't allow overwriting snapshot versions
          snapshot-commit-suffix: 'true'

      - name: Publish to GitHub Packages
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.repository_owner }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository -Pversion=${{ steps.version.outputs.version }}
