POM_DESCRIPTION=Composable components for Kotlin projects.
POM_URL=https://github.com/stashymane/standard
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=Apache-2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/stashymane/standard/
POM_SCM_CONNECTION=scm:git:git://github.com/stashymane/standard.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/stashymane/standard.git
POM_DEVELOPER_ID=stashymane
