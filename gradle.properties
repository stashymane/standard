# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.tooling.parallel=true
# skip publishing sha256/sha512
# only needed until Gradle ~v9.9.0
# https://github.com/gradle/gradle/commit/98eb4aabb1e02244aadb56cd7dc864f4ace00604
org.gradle.internal.publish.checksums.insecure=true
# Kotlin
kotlin.code.style=official
kotlin.incremental.wasm=true
# Publishing
group=dev.stashy.standard
version=0.0.0-SNAPSHOT
publish.skipJavadocForSnapshots=true
# Maven metadata
GITHUB_PACKAGES_REPOSITORY=stashymane/standard
