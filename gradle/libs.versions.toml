[versions]
jvm = "25"
jvm-target = "17"

mavenPublish = "0.37.0"
dokka = "2.2.0"

koin = "4.2.2"
koin-plugin = "1.2.3"
materialIcons = "1.7.3"

colormath = "3.7.0"

kotest = "6.2.6"
testResources = "0.16.2"

exposed = "1.6.1"
h2 = "2.5.252"
r2dbc-h2 = "1.1.0.RELEASE"
sqlite = "3.53.4.0"

[libraries]
colormath-core = { module = "com.github.ajalt.colormath:colormath", version.ref = "colormath" }
colormath-compose = { module = "com.github.ajalt.colormath:colormath-ext-jetpack-compose", version.ref = "colormath" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
r2dbc-h2 = { module = "io.r2dbc:r2dbc-h2", version.ref = "r2dbc-h2" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
testResources = { module = "com.goncalossilva:resources", version.ref = "testResources" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIcons" }

[plugins]
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
koinCompiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }
